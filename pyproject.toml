# FOOTBALL — tool configuration (no [project]: this repo is NOT an installable
# package; the top-level `src` layouts in each competition would collide).

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
# F401 stays ignored: the 151 remaining findings are project-internal facade
# re-exports and module-level alias chains (e.g. groups.py's
# precompute_swiss_matchup_lambdas), which a blind fix breaks at import time.
# F821 (undefined names) stays enforced — that is the high-signal one.
ignore = ["F401", "F841", "F811", "F541", "F601"]

[tool.ruff.lint.per-file-ignores]
# orchestrator.py F821 at line 1256 is a runtime locals() guard (the name is
# only ever referenced when "active_season_value" is actually in scope).
"competitions/ucl/src/orchestrator.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true

# HARD-04 / D-02: explicit numeric coverage floor on the prediction kernel.
# Enforced only when coverage is explicitly requested (pytest --cov=football_core);
# single-test iteration stays fast because fail_under lives in coverage's own
# config, not in pytest addopts.
[tool.coverage.run]
source = ["football_core"]
branch = false
omit = [
    "*/tests/*",
    "football_core/tests/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]