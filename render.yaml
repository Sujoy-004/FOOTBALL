# Render Blueprint for FOOTBALL API (Milestone v2.0)
# Reference: D-01, D-02, D-03, D-04, DEPLOY-01
services:
  - type: web
    name: football-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:asgi_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DATABASE_URL
        sync: false
      - key: FOOTBALL_DATA_ORG_KEY
        sync: false
      - key: THE_ODDS_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:8080,http://localhost:3000
